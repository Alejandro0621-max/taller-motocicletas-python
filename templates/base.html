<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema de Gestión{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="contenedor">
        <!-- ENCABEZADO -->
        <header class="encabezado">
            {% block header %}Bienvenido{% endblock %}
        </header>

        <!-- CUERPO DEL PROGRAMA -->
        <div class="cuerpo">
            <!-- MENÚ PRINCIPAL DINÁMICO -->
            <aside class="menu-principal">
                <nav>
                    {% for url, nombre in lista_menu.items() %}
                    <a href="{{ url }}">
                        {{ nombre | capitalize }}
                    </a>
                    {% endfor %}
                </nav>
            </aside>

            <!-- INFORMACIÓN PRINCIPAL -->
            <main class="informacion-principal">
                {% block content %}
                {% endblock %}
            </main>
        </div>
    </div>
</body>

</html>
